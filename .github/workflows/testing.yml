name: Testing
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  unit-test:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unittest
        run: |
          python -m unittest discover -p 'test*.py' 2> unittest_results.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unittest_results.txt
          path: unittest_results.txt

  jmeter-test:
    needs: unit-test
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Apache JMeter
        run: |
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          echo "$GITHUB_WORKSPACE/apache-jmeter-5.6.3/bin" >> $GITHUB_PATH
      - name: Execute JMeter Test
        run: |
          ./apache-jmeter-5.6.3/bin/jmeter -n -t ResultFileGenerator.jmx -l jmeter_test_result.jtl -e -o ./html-report
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Python Results Analyzer
        run: python jmeter_result_parser.py jmeter_test_config.toml
      - name: Upload Results & HTML Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jmeter-reports
          path: |
            jmeter_test_result.jtl
            ./html-report
            python_analysis_summary.csv



          
