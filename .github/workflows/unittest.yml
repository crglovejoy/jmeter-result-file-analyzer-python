name: Python Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unittest
        run: |
          python -m unittest discover -p 'Test*.py' 2> results.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results.txt
          path: results.txt
          
